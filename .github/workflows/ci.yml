# Integración continua: en cada push a main y en cada pull request comprueba que
# el proyecto compila y que los tests pasan. Así un cambio roto se ve antes de
# desplegarlo. No despliega nada.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo mientras corre uno anterior de la misma rama, se cancela el viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (exactamente las del lock)
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # El build solo necesita que existan; no se conecta a nada.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: clave-de-ci-sin-valor

  auditoria:
    name: Vulnerabilidades de dependencias (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Aparecen avisos nuevos con el tiempo aunque no se toque el código: por eso
    # no bloquea, solo deja constancia en el resumen.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
